# ===========================================================================
# GraphAnalysis Pipeline Configuration Template
# 
# Usage: Copy this file to 'prop.yaml' and configure for your environment.
# ===========================================================================

# ---------------------------------------------------------------------------
# Logging Configuration
# ---------------------------------------------------------------------------
log:
  filepath: "logs/logs.log"
  level: "INFO"

# ---------------------------------------------------------------------------
# Graph Generation Stage
# ---------------------------------------------------------------------------
graph_generation:
  to_execute: false # Set to true to execute graph generation from DB
  delete_tmp_after_merge: false
  parameters:
    checkpoint_every: 5000
    n_workers: 4
    fast_rt_threshold: 60
    is_community: false
    community_file: "./resources/communities.csv"
    community_strategy: "auto"   # "auto" | "batch" | "shard"
    input:
      type: "json" # "mongo", "json", "csv"
      conf:
        uri: "./resources/twitter_sample.json" # URI or DB connection string
        username: null
        password: null
        authName: null
        authMechanism: null
        db_name: null
        collection: null
        chunk_start_date: "01/01/2022" # format: DD/MM/YYYY
        chunk_end_date: "31/12/2022"
        method: "day"
    graph_type:
      retweet: true
      tweet_retweet: false
      user_hashtag: true
      response: true
      mention: true
      hashtag_cooccurrences: true
      user_user: false
    output:
      path: "./resources/"
      graph_file_name:
        retweet: "retweet"
        mention: "mention"
        retweet_user: "retweet_user"
        response: "response"
        response_user: "response_user"
        hashtag: "hashtag"
        hashtag_cooccurrences: "hashtag_cooccurrences"
        multigraph: "multigraph"
      map_file_name_prefix: "map"
      intermediate_file_format: "parquet" # "parquet", "feather", "csv"
      final_file_format: "parquet"

# ---------------------------------------------------------------------------
# Community Detection Stage
# ---------------------------------------------------------------------------
community_detection:
  parameters:
    read_from_edge_list: false
    read_from_file: true # Set to true if NOT executing graph_generation
    temporal: false
    graph_file_path:
      - "./resources/multigraph_16_10_2024_14_21_07.csv"
    pickle_graph_file_path: "./resources/twitter_graph_dump/1"
  leiden:
    to_execute: false
    parameters:
      community_output_file_path: "./resources/communities_leiden"
  combo:
    to_execute: false
    parameters:
      community_output_file_path: "./resources/communities_combo"
  hierarchical:
    to_execute: false
    parameters:
      first_level_communities_file: "./resources/nodes_with_communities.csv"
      community_col_name: "0.6"
      community_output_file_path: "./resources/hierarchical"
      top_k: 500
      collapse_nodes: true
      min_size: 30
      pickle_output_path: "./resources/twitter_graph_dump"

# ---------------------------------------------------------------------------
# Get Users Text Stage
# ---------------------------------------------------------------------------
get_users_text:
  to_execute: false # Set to true to execute text extraction
  parameters:
    communities:
      indexes: []
      community_col_name: "cluster3"
      read_communities_from_file: true
      community_file_path: "./resources/communities_16_10_2024_14_22_07.csv"
    map_file_path:
      read_maps_from_file: true
      user_map: "./resources/map_user_id_16_10_2024_14_21_05.csv"
      hashtag_map: "./resources/map_hashtag_16_10_2024_14_21_05.csv"
      retweet_user_map: "./resources/map_retweeted_user_id_16_10_2024_14_21_06.csv"
    input:
      type: "json"
      conf:
        uri: "./resources/twitter_sample.json"
        username: null
        password: null
        authName: null
        authMechanism: null
        db_name: null
        collection: null

# ---------------------------------------------------------------------------
# Topic Builder Stage
# ---------------------------------------------------------------------------
topic_builder:
  to_execute: false
  parameters:
    topics_file_path: "./resources/topics_info"
    docs_file_path: "./resources/docs_info"
    model:
      model_path: "./resources/topic_model"
      serialization: "pickle"
