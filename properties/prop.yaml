# Logging Configuration
log:
  filepath: "logs/logs.log"
  level: "INFO"

# Graph Generation Stage
graph_generation:
  to_execute: true
  delete_tmp_after_merge: true
  parameters:
    checkpoint_every: 500
    n_workers: 4
    fast_rt_threshold: 60
    is_community: true
    community_file: "./resources/communities_rp_0.4.csv"
    community_strategy: "shard"   # "batch" | "shard" | "linear"
    community_batch_size: 500
    input:
      type: "json"
      conf:
        uri: "mongodb://localhost:27017/"
        db_name: "twitter"
        collection: "QCPS_2"
        chunk_start_date: "23/02/2022"
        chunk_end_date: "16/01/2023"
        method: "day"
        username: null
        password: null
        authName: null
        authMechanism: null
    graph_type:
      tweet_retweet: false
      user_hashtag: false
      hashtag_cooccurrences: false
      retweet: false
      response: false
      mention: false
      user_user: true
    output:
      path: "./resources/"
      graph_file_name:
        retweet: "retweet"
        mention: "mention"
        retweet_user: "retweet_user"
        response: "response"
        response_user: "response_user"
        hashtag: "hashtag"
        hashtag_cooccurrences: "hashtag_cooccurrences"
        multigraph: "multigraph"
      map_file_name_prefix: "map"
      intermediate_file_format: "feather"
      final_file_format: "parquet"

# Community Detection Stage
community_detection:
  parameters:
    read_from_edge_list: false
    read_from_file: false
    temporal: false
    graph_file_path:
      - "./resources/sample.csv"
    pickle_graph_file_path: "./resources/twitter_graph_dump/1"
  leiden:
    to_execute: false
    parameters:
      community_output_file_path: "./resources/communities_leiden"
  combo:
    to_execute: false
    parameters:
      community_output_file_path: "./resources/communities_combo"
  hierarchical:
    to_execute: false
    parameters:
      first_level_communities_file: ""
      community_col_name: ""
      community_output_file_path: ""
      top_k: 500
      collapse_nodes: true
      min_size: 30
      pickle_output_path: "./resources/twitter_graph_dump"

# Get Users Text Stage
get_users_text:
  to_execute: false
  parameters:
    communities:
      indexes: []
      community_col_name: "cluster3"
      read_communities_from_file: true
      community_file_path: "./resources/communities_16_10_2024_17_09_21.csv"
    map_file_path:
      read_maps_from_file: true
      user_map: "./resources/map_user_id_16_10_2024_17_09_14.csv"
      hashtag_map: "./resources/map_hashtag_16_10_2024_17_09_14.csv"
      retweet_user_map: "./resources/map_retweeted_user_id_16_10_2024_17_09_14.csv"
    input:
      type: "json"
      conf:
        uri: "./resources/twitter_sample.json"
        username: null
        password: null
        authName: null
        authMechanism: null
        db_name: null
        collection: null

# Topic Builder Stage
topic_builder:
  to_execute: false
  parameters:
    topics_file_path: "./resources/topics_info"
    docs_file_path: "./resources/docs_info"
    model:
      model_path: "./resources/topic_model"
      serialization: "pickle"
